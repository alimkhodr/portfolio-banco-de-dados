<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Rodapé do README</title>

     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
       --force-device-scale-factor=1 --window-size=1600,200 --virtual-time-budget=8000 \

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@400;500&display=block" rel="stylesheet">
<style>
  :root { --cobalt: #2b52f0; --cobalt-100: #e3e9ff; --cobalt-700: #2141cc; --line: rgb(255 255 255 / 0.18); }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1600px; height: 200px; overflow: hidden; }
  body { position: relative; background: var(--cobalt); color: #fff; font-family: 'Host Grotesk', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .layer { position: absolute; inset: 0; pointer-events: none; }
  .light { background: radial-gradient(55% 70% at 35% 125%, rgb(186 204 255 / 0.5), transparent 70%), radial-gradient(60% 90% at 0% 0%, rgb(20 34 140 / 0.45), transparent 60%); }
  .dots { background-image: radial-gradient(circle at center, rgb(255 255 255 / 0.24) 1px, transparent 1.4px); background-size: 9px 9px; mask-image: radial-gradient(90% 120% at 35% 110%, black 15%, transparent 75%); }
  .cell { position: absolute; display: grid; place-items: center; background: rgb(255 255 255 / 0.06); color: rgb(255 255 255 / 0.92); border-left: 1px solid var(--line); }
  .rule { position: absolute; left: 0; right: 0; height: 1px; background: var(--line); }
  .node { position: absolute; width: 9px; height: 9px; margin: -4px 0 0 -4px; border: 1px solid rgb(255 255 255 / 0.55); background: var(--cobalt); }
  .badge { width: fit-content; padding: 8px 20px; border-radius: 999px; box-shadow: inset 0 0 0 1.5px rgb(255 255 255 / 0.45); font-size: 22px; }
  .arrow { display: grid; place-items: center; border-radius: 999px; background: #fff; color: var(--cobalt-700); }
</style>
</head>
<body>
  <div class="layer light"></div>
  <div class="layer dots"></div>
  <div style="position:absolute;inset:0 80px;display:flex;align-items:center;justify-content:space-between">
    <div style="font-size:52px;font-weight:500;letter-spacing:-0.03em">Obrigado pela visita.</div>
    <div style="display:flex;align-items:center;gap:16px;font-size:34px;font-weight:500">alikhodr.dev <span class="arrow" style="width:48px;height:48px"><svg width="26" height="26" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="m221.66 133.66l-72 72a8 8 0 0 1-11.32-11.32L196.69 136H40a8 8 0 0 1 0-16h156.69l-58.35-58.34a8 8 0 0 1 11.32-11.32l72 72a8 8 0 0 1 0 11.32"/></svg></span></div>
  </div>
</body>
</html>
